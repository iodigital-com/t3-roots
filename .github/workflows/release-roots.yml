# Builds unsigned Windows x64 and ad-hoc signed macOS (arm64 + x64) installers into a draft fork release.
# Start by pushing a tag such as v0.1.10-roots.8 on the patched commit.
# Publishing the resulting draft needs Vincent's OK for that exact release.
name: Roots release

on:
  push:
    tags:
      - "v*-roots.*"

permissions:
  contents: read

concurrency:
  group: roots-release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  T3CODE_TELEMETRY_CHANNEL: dev
  T3CODE_DESKTOP_UPDATE_REPOSITORY: ${{ github.repository }}
  T3CODE_DESKTOP_SIGNED: "false"

jobs:
  cli:
    if: github.repository == 'iodigital-com/t3-roots' || github.repository == 'vincentvermeire/t3-roots'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      version: ${{ steps.meta.outputs.version }}
      upstream_tag: ${{ steps.meta.outputs.upstream_tag }}
      commit: ${{ steps.meta.outputs.commit }}
    steps:
      # actions/checkout's credential cleanup runs `git submodule foreach`, which fails on the
      # orphaned gitlinks in the vendored .repos tree, so fetch with plain git + ephemeral auth.
      - name: Checkout
        shell: bash
        env:
          GIT_TERMINAL_PROMPT: "0"
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')
          git init .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git -c "http.${GITHUB_SERVER_URL}/.extraheader=AUTHORIZATION: basic ${auth}" fetch --tags origin "$GITHUB_SHA"
          git sparse-checkout set --no-cone '/*' '!/.repos/'
          git checkout --detach "$GITHUB_SHA"

      - name: Read release version and base
        id: meta
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-roots\.[0-9]+$ ]]
          upstream_tag=${GITHUB_REF_NAME%%-roots.*}
          git fetch --no-tags https://github.com/pingdotgg/t3code.git "refs/tags/$upstream_tag"
          git merge-base --is-ancestor FETCH_HEAD HEAD
          commit=$(git rev-parse HEAD)
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          echo "upstream_tag=$upstream_tag" >> "$GITHUB_OUTPUT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/setup-ci-deps
        with:
          install-args: --filter=t3... --filter=@t3tools/web... --filter=@t3tools/desktop... --filter=@t3tools/scripts...

      - name: Install Linux archive libraries
        run: sudo apt-get update && sudo apt-get install -y libatomic1 patchelf

      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-gnu

      - name: Build versioned web, server and Electron bundles
        env:
          RELEASE_VERSION: ${{ steps.meta.outputs.version }}
          APP_VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          node scripts/update-release-package-versions.ts "$RELEASE_VERSION"
          vp run build:desktop:bundle

      - name: Build CLI executable and resource monitor
        run: |
          set -euo pipefail
          node apps/server/scripts/cli.ts build-exe --verbose
          cargo build --locked --release --manifest-path native/resource-monitor/Cargo.toml --target x86_64-unknown-linux-gnu
          mkdir -p "$RUNNER_TEMP/cli-resource-monitor/linux-x64"
          cp native/resource-monitor/target/x86_64-unknown-linux-gnu/release/t3-resource-monitor "$RUNNER_TEMP/cli-resource-monitor/linux-x64/"

      - name: Archive and smoke-test the CLI
        env:
          RELEASE_VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          node scripts/build-cli-archive.ts --platform linux --arch x64 --version "$RELEASE_VERSION" \
            --resource-monitor-dir "$RUNNER_TEMP/cli-resource-monitor" --output-dir release-cli
          node scripts/smoke-cli-archive.ts --archive "release-cli/t3-$RELEASE_VERSION-linux-x64.tar.gz" --expect-version "$RELEASE_VERSION"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: roots-js-bundle
          path: |
            apps/server/dist
            apps/desktop/dist-electron
          if-no-files-found: error

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: roots-cli-linux-x64
          path: release-cli/*.tar.gz
          if-no-files-found: error
          compression-level: 0

  windows:
    needs: cli
    if: github.repository == 'iodigital-com/t3-roots' || github.repository == 'vincentvermeire/t3-roots'
    runs-on: windows-2025
    timeout-minutes: 90
    env:
      RELEASE_VERSION: ${{ needs.cli.outputs.version }}
    steps:
      - name: Checkout
        shell: bash
        env:
          GIT_TERMINAL_PROMPT: "0"
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')
          git init .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git -c "http.${GITHUB_SERVER_URL}/.extraheader=AUTHORIZATION: basic ${auth}" fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git sparse-checkout set --no-cone '/*' '!/.repos/'
          git -c checkout.workers=0 checkout --detach FETCH_HEAD

      - uses: ./.github/actions/setup-ci-deps
        with:
          install-args: --filter=@t3tools/desktop... --filter=t3... --filter=@t3tools/scripts...

      - name: Ensure Electron runtime is installed
        run: vp run --filter @t3tools/desktop ensure:electron

      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc

      - name: Ensure Windows native build tools
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python --version
          if ($LASTEXITCODE -ne 0) { throw 'Python 3 is required.' }
          tar.exe --version
          if ($LASTEXITCODE -ne 0) { throw 'Windows tar is required.' }
          $installerDir = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer'
          $vswhere = Join-Path $installerDir 'vswhere.exe'
          $installation = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (!$installation) { throw 'Visual Studio C++ tools and Windows SDK are required.' }
          $toolset = Get-ChildItem (Join-Path $installation 'VC\Tools\MSVC') -Directory | Sort-Object { [version]$_.Name } -Descending | Select-Object -First 1
          if (!$toolset -or !(Test-Path (Join-Path $toolset.FullName 'lib\spectre\x64'))) {
            $process = Start-Process -FilePath (Join-Path $installerDir 'vs_installer.exe') -ArgumentList @(
              'modify', '--installPath', ('"' + $installation + '"'),
              '--add', 'Microsoft.VisualStudio.Component.VC.Runtimes.x86.x64.Spectre',
              '--quiet', '--norestart'
            ) -WindowStyle Hidden -Wait -PassThru
            if ($process.ExitCode -notin @(0, 3010)) { throw "Spectre library installation failed: $($process.ExitCode)" }
          }

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: roots-js-bundle
          path: apps

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: roots-cli-linux-x64
          path: release-cli

      - name: Build unsigned Windows x64 installer
        run: |
          set -euo pipefail
          node scripts/update-release-package-versions.ts "$RELEASE_VERSION"
          node scripts/build-desktop-artifact.ts --platform win --target nsis --arch x64 \
            --build-version "$RELEASE_VERSION" --skip-build --verbose \
            --wsl-runtime "release-cli/t3-$RELEASE_VERSION-linux-x64.tar.gz" --output-dir release

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: roots-desktop-win-x64
          path: |
            release/T3-Roots-${{ needs.cli.outputs.version }}-x64.exe
            release/T3-Roots-${{ needs.cli.outputs.version }}-x64.exe.blockmap
            release/latest.yml
          if-no-files-found: error
          compression-level: 0

  mac_arm64:
    needs: cli
    if: github.repository == 'iodigital-com/t3-roots' || github.repository == 'vincentvermeire/t3-roots'
    runs-on: macos-15
    timeout-minutes: 90
    env:
      RELEASE_VERSION: ${{ needs.cli.outputs.version }}
    steps:
      - name: Checkout
        shell: bash
        env:
          GIT_TERMINAL_PROMPT: "0"
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')
          git init .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git -c "http.${GITHUB_SERVER_URL}/.extraheader=AUTHORIZATION: basic ${auth}" fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git sparse-checkout set --no-cone '/*' '!/.repos/'
          git -c checkout.workers=0 checkout --detach FETCH_HEAD

      - uses: ./.github/actions/setup-ci-deps
        with:
          install-args: --filter=@t3tools/desktop... --filter=t3... --filter=@t3tools/scripts...

      - name: Ensure Electron runtime is installed
        run: vp run --filter @t3tools/desktop ensure:electron

      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          targets: aarch64-apple-darwin

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: roots-js-bundle
          path: apps

      - name: Build ad-hoc signed macOS arm64 DMG and ZIP
        run: |
          set -euo pipefail
          node scripts/update-release-package-versions.ts "$RELEASE_VERSION"
          node scripts/build-desktop-artifact.ts --platform mac --target dmg --arch arm64 \
            --build-version "$RELEASE_VERSION" --skip-build --verbose --output-dir release

      - name: Verify ad-hoc code signature and launch packaged app
        run: |
          set -euo pipefail
          mount="$RUNNER_TEMP/desktop-launch-dmg"
          hdiutil attach -nobrowse -readonly -mountpoint "$mount" "release/T3-Roots-$RELEASE_VERSION-arm64.dmg"
          trap 'hdiutil detach "$mount" -force >/dev/null || true' EXIT
          app=$(ls -d "$mount"/*.app)
          codesign --verify --deep --strict --verbose=2 "$app"
          executable=$(/usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" "$app/Contents/Info.plist")
          node scripts/smoke-desktop-app.ts --artifacts-dir "$RUNNER_TEMP/desktop-launch-check" --executable "$app/Contents/MacOS/$executable"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: roots-desktop-mac-arm64
          path: |
            release/T3-Roots-${{ needs.cli.outputs.version }}-arm64.dmg
            release/T3-Roots-${{ needs.cli.outputs.version }}-arm64.zip
          if-no-files-found: error
          compression-level: 0

  mac_x64:
    needs: cli
    if: github.repository == 'iodigital-com/t3-roots' || github.repository == 'vincentvermeire/t3-roots'
    runs-on: macos-15-intel
    timeout-minutes: 90
    env:
      RELEASE_VERSION: ${{ needs.cli.outputs.version }}
    steps:
      - name: Checkout
        shell: bash
        env:
          GIT_TERMINAL_PROMPT: "0"
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')
          git init .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git -c "http.${GITHUB_SERVER_URL}/.extraheader=AUTHORIZATION: basic ${auth}" fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git sparse-checkout set --no-cone '/*' '!/.repos/'
          git -c checkout.workers=0 checkout --detach FETCH_HEAD

      - uses: ./.github/actions/setup-ci-deps
        with:
          install-args: --filter=@t3tools/desktop... --filter=t3... --filter=@t3tools/scripts...

      - name: Ensure Electron runtime is installed
        run: vp run --filter @t3tools/desktop ensure:electron

      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          targets: x86_64-apple-darwin

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: roots-js-bundle
          path: apps

      - name: Build ad-hoc signed macOS x64 DMG and ZIP
        run: |
          set -euo pipefail
          node scripts/update-release-package-versions.ts "$RELEASE_VERSION"
          node scripts/build-desktop-artifact.ts --platform mac --target dmg --arch x64 \
            --build-version "$RELEASE_VERSION" --skip-build --verbose --output-dir release

      - name: Verify ad-hoc code signature and launch packaged app
        run: |
          set -euo pipefail
          mount="$RUNNER_TEMP/desktop-launch-dmg"
          hdiutil attach -nobrowse -readonly -mountpoint "$mount" "release/T3-Roots-$RELEASE_VERSION-x64.dmg"
          trap 'hdiutil detach "$mount" -force >/dev/null || true' EXIT
          app=$(ls -d "$mount"/*.app)
          codesign --verify --deep --strict --verbose=2 "$app"
          executable=$(/usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" "$app/Contents/Info.plist")
          node scripts/smoke-desktop-app.ts --artifacts-dir "$RUNNER_TEMP/desktop-launch-check" --executable "$app/Contents/MacOS/$executable"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: roots-desktop-mac-x64
          path: |
            release/T3-Roots-${{ needs.cli.outputs.version }}-x64.dmg
            release/T3-Roots-${{ needs.cli.outputs.version }}-x64.zip
          if-no-files-found: error
          compression-level: 0

  release:
    needs: [cli, windows, mac_arm64, mac_x64]
    if: github.repository == 'iodigital-com/t3-roots' || github.repository == 'vincentvermeire/t3-roots'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      RELEASE_VERSION: ${{ needs.cli.outputs.version }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: roots-cli-linux-x64
          path: release-assets

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: roots-desktop-win-x64
          path: release-assets

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: roots-desktop-mac-arm64
          path: release-assets

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: roots-desktop-mac-x64
          path: release-assets

      - name: Generate and validate SHA256SUMS
        run: |
          set -euo pipefail
          cd release-assets
          sha256sum \
            "T3-Roots-$RELEASE_VERSION-x64.exe" \
            "T3-Roots-$RELEASE_VERSION-arm64.dmg" \
            "T3-Roots-$RELEASE_VERSION-arm64.zip" \
            "T3-Roots-$RELEASE_VERSION-x64.dmg" \
            "T3-Roots-$RELEASE_VERSION-x64.zip" \
            "t3-$RELEASE_VERSION-linux-x64.tar.gz" > SHA256SUMS
          sha256sum --check SHA256SUMS

      - name: Refuse to modify an already published release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          published=$(gh api "repos/${GITHUB_REPOSITORY}/releases" --paginate --jq '.[] | select(.tag_name == env.RELEASE_TAG and .draft == false) | .id')
          [[ -z "$published" ]] || { echo 'This tag already has a published release.' >&2; exit 1; }

      - name: Save draft release
        uses: softprops/action-gh-release@40c2ca6ddd77ba2a30bbea8f67409c0f76868d67 # v3
        with:
          repository: ${{ github.repository }}
          tag_name: ${{ github.ref_name }}
          target_commitish: ${{ needs.cli.outputs.commit }}
          name: T3 Roots ${{ github.ref_name }}
          body: |
            Based on upstream tag ${{ needs.cli.outputs.upstream_tag }}.
            Fork commit ${{ needs.cli.outputs.commit }}.

            Unsigned Windows x64 installer and ad-hoc signed macOS (arm64 + x64) DMG/ZIP archives. Publishing this draft needs Vincent's OK.
          draft: true
          prerelease: false
          make_latest: false
          files: release-assets/*
          fail_on_unmatched_files: true
          token: ${{ github.token }}
